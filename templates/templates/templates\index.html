<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Downloader</title>
<style>body{background:#111;color:#fff;font-family:Arial;display:flex;justify-content:center;padding:20px}.box{background:#222;padding:20px;border-radius:12px;max-width:500px;width:100%}input{width:100%;padding:14px;border-radius:8px;border:none;margin:10px 0}button{width:100%;padding:14px;background:#00ff88;border:none;border-radius:8px;font-weight:bold}a.btn{display:block;background:#00ff88;color:#000;padding:12px;text-align:center;border-radius:8px;margin-top:10px;text-decoration:none}</style>
</head><body><div class="box"><h2 style="color:#00ff88;text-align:center">Video Downloader</h2>
<input id="url" placeholder="Link paste karen"><button onclick="getLink()">Get Download</button><div id="out" style="margin-top:15px"></div></div>
<script>
async function getLink(){
 let u=document.getElementById('url').value.trim(); if(!u) return alert('Link dalen');
 document.getElementById('out').innerHTML='Loading...';
 let r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:u})});
 let d=await r.json();
 if(d.error){document.getElementById('out').innerHTML=d.error; return;}
 let h=`<b>${d.title}</b><br><img src="${d.thumbnail}" style="width:100%;border-radius:10px;margin:10px 0">`;
 d.downloads.forEach(x=>{h+=`<a class="btn" href="${x.url}" target="_blank">Download ${x.quality}</a>`});
 document.getElementById('out').innerHTML=h;
}
</script></body></html>
